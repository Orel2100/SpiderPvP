name: KitPvP
version: 1.0
api-version: 1.13
author: [YourName]
main: kitpvp.kitpvp.Main
description: A KitPvP plugin with premium kits and economy features.


commands:
  coins:
    description: Check your coin balance.
    usage: /<command>
  addcoins:
    description: Add coins to a player's balance.
    usage: /<command> <player> <amount>
    permission: kitpvp.addcoins
  removecoins:
    description: Remove coins from a player's balance.
    usage: /<command> <player> <amount>
    permission: kitpvp.removecoins
  setspawn:
    description: Sets the spawn location for the server.
    usage: /<command>
    permission: essentials.setspawn
  spawn:
    description: Teleports the player to the spawn location after a 3-second delay.
    permission: essentials.spawn
  fly:
    description: Enabling fly mode.
    permission: essentials.fly
  disableparticles:
    description: Disables the particle effects for the player.
    usage: /disableparticles
    aliases: [pd]
  setchestlocation:
    description: set reward spawn
    usage: /setchestlocation
    aliases: [scl]
  removechestlocation:
    description: remove reward spawn
    usage: /removechestlocation
    aliases: [rcl]
  setarenaspawn:
    description: Set a new spawn point for the arena.
    usage: /setarenaspawn
  arena:
    description: Teleport to a random spawn point in the arena.
    usage: /arena
  giverefillstick:
    description: REFILL STICK
    aliases: [refillstick]
  report:
    description: Report a player for breaking the rules.
    usage: /<command> <player>
    permission: kitpvp.report
  reports:
    description: View and manage player reports.
    usage: /<command>
    permission: kitpvp.reports.view
  punish:
    description: Punish a player.
    usage: /<command> <player>
    permission: kitpvp.punish
  myreports:
    description: View your submitted reports.
    usage: /<command>
    permission: kitpvp.myreports
  unban:
    description: Unban a player.
    usage: /<command> <player>
    permission: kitpvp.unban
  unmute:
    description: Unmute a player.
    usage: /<command> <player>
    permission: kitpvp.unmute
  duel:
    description: Join the 1v1 duel queue.
    usage: /<command>
    permission: kitpvp.duel
  arena:
    description: Teleport to a random spawn point in the arena.
    usage: /arena
    permission: kitpvp.arena
permissions:
  kitpvp.addcoins:
    description: Allows adding coins to players.
    default: op
  kitpvp.removecoins:
    description: Allows removing coins from players.
    default: op
  kitpvp.report:
    description: Allows players to report other players.
    default: true
  kitpvp.reports.view:
    description: Allows staff to view and manage reports.
    default: op
  kitpvp.reports.notify:
    description: Notifies staff about new reports.
    default: op
  kitpvp.punish:
    description: Allows staff to punish players.
    default: op
  kitpvp.punish.ban:
    description: Allows staff to ban players.
    default: op
  kitpvp.punish.mute:
    description: Allows staff to mute players.
    default: op
  kitpvp.punish.kick:
    description: Allows staff to kick players.
    default: op
  kitpvp.punish.warn:
    description: Allows staff to warn players.
    default: op
  kitpvp.myreports:
    description: Allows players to view their submitted reports.
    default: true
  kitpvp.unban:
    description: Allows staff to unban players.
    default: op
  kitpvp.unmute:
    description: Allows staff to unmute players.
    default: op
  kitpvp.duel:
    description: Allows players to join the duel queue.
    default: true
  arena.setspawn:
    description: Allows setting arena spawn points.
    default: op
  kitpvp.arena:
    description: Allows teleporting to the arena.
    default: true
  arena.create:
    description: Allows creating arenas.
    default: op



